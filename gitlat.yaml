เอาต์พุตยาวขึ้นเนื่องจาก Git:

โคลนพื้นที่เก็บข้อมูลโดยไม่รวมไฟล์ที่มีขนาดใหญ่กว่า 1 เมกะไบต์
ดาวน์โหลดไฟล์ขนาดใหญ่ที่ขาดหายไปซึ่งจําเป็นต่อการตรวจสอบสาขาเริ่มต้น
เมื่อเปลี่ยนสาขา Git อาจดาวน์โหลดไฟล์ที่หายไปเพิ่มเติม

กรองตามประเภทวัตถุ
สําหรับที่เก็บข้อมูลที่มีไฟล์นับล้านและมีประวัติยาวนาน คุณสามารถแยกไฟล์ทั้งหมดและใช้งานได้ git ชําระเงินเบาบาง เพื่อลดขนาดของ สําเนาการทํางานของคุณ

