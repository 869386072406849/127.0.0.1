สําหรับรายละเอียดเพิ่มเติม โปรดดูเอกสารประกอบ Git สําหรับ การชําระเงินแบบกระจัดกระจาย●

กรองตามเส้นทางไฟล์
การบูรณาการที่ลึกยิ่งขึ้นระหว่างโคลนบางส่วนและการชําระเงินแบบกระจัดกระจายสามารถทําได้ผ่านทาง --filter=sparse:oid=<blob-ish> ข้อมูลจําเพาะตัวกรอง โหมดการกรองนี้ใช้รูปแบบที่คล้ายกับ .gitignore ไฟล์เพื่อระบุไฟล์ที่จะรวมไว้เมื่อทําการโคลนและดึงข้อมูล

โคลนบางส่วนโดยใช้ เบาบาง ตัวกรองยังอยู่ในช่วงทดลอง มันอาจจะช้าและเพิ่มขึ้นอย่างมาก กีตาลี่ การใช้ทรัพยากรเมื่อทําการโคลนและดึงข้อมูล กรองหยดทั้งหมดและใช้การชําระเงินแบบกระจัดกระจาย แทน เพราะ git-sparse-ชําระเงิน ลดความซับซ้อน โคลนบางส่วนประเภทนี้ใช้และเอาชนะข้อจํากัดของมัน

สําหรับรายละเอียดเพิ่มเติม โปรดดูเอกสารประกอบ Git สําหรับ rev-list-ตัวเลือก●

สร้างสเป็คตัวกรอง ตัวอย่างเช่นพิจารณาพื้นที่เก็บข้อมูลเสาหินที่มีการใช้งานจํานวนมาก, แต่ละรายการอยู่ในไดเร็กทอรีย่อยที่แตกต่างกันในรูท สร้างไฟล์ shiny-app/.filterspec:

# เฉพาะเส้นทางที่ระบุไว้ในไฟล์จะถูกดาวน์โหลดเมื่อดําเนินการ
# โคลนบางส่วนโดยใช้ `--filter=sparse:oid=shiny-app/.gitfilterspec`

# รวม filterspec อย่างชัดเจนที่จําเป็นในการกําหนดค่าการชําระเงินแบบกระจัดกระจายด้วย
# git config --local core.sparsecheckout จริง
# git show master:snazzy-app/.gitfilterspec >> .git/info/sparse-checkout
shiny-app/.gitfilterspec

# แอปเงา
แวววาว-app/

# การพึ่งพาอาศัยกัน
ชิมเมอร์รี่-แอพ/
ส่วนประกอบที่ใช้ร่วมกัน-a/
ส่วนประกอบที่ใช้ร่วมกัน-b/
โคลนและกรองตามเส้นทาง การสนับสนุนสําหรับ --filter=sparse:oid การใช้ คําสั่งโคลนไม่ได้รวมเข้ากับการชําระเงินแบบกระจัดกระจายอย่างสมบูรณ์

เปลือก
# โคลนชุดกรองของวัตถุโดยใช้ filterspec ที่เก็บไว้ใน
# เซิร์ฟเวอร์ คําเตือน: ขั้นตอนนี้อาจจะช้ามาก!
git โคลน --แยกวิเคราะห์ --กรอง=เบาบาง:oid=มาสเตอร์:shiny-app/.gitfilterspec <url>

# ทางเลือก: ตรวจสอบวัตถุที่หายไปซึ่งยังไม่ได้ดึงข้อมูล
git rev-list --ทั้งหมด --เงียบ --วัตถุ --หายไป=พิมพ์ | ห้องน้ํา -l
บูรณาการ Git กับ ทุบตี, Zsh ฯลฯ และบรรณาธิการโดยอัตโนมัติ แสดงข้อมูลสถานะ Git ที่มักทํางาน เอามาเลย ซึ่งดึงเอา พื้นที่เก็บข้อมูลทั้งหมด อาจจําเป็นต้องปิดใช้งานหรือกําหนดค่าการผสานรวมเหล่านี้ใหม่

ลบการกรองโคลนบางส่วน
ที่เก็บ Git ที่มีการกรองโคลนบางส่วนสามารถลบการกรองออกได้ ถึง ลบการกรอง:

ดึงข้อมูลทุกสิ่งที่ถูกแยกออกโดยตัวกรองเพื่อให้แน่ใจว่า พื้นที่เก็บข้อมูลเสร็จสมบูรณ์ ถ้า git ชําระเงินเบาบาง ถูกใช้, ใช้ git sparse-checkout ปิดใช้งาน เพื่อปิดการใช้งาน ดู ปิดการใช้งาน เอกสารประกอบ สําหรับข้อมูลเพิ่มเติม

แล้วทําเป็นประจํา ดึง เพื่อให้แน่ใจว่าพื้นที่เก็บข้อมูลเสร็จสมบูรณ์ เพื่อตรวจสอบว่า มีวัตถุที่ขาดหายไปในการดึงแล้วดึงออกมา โดยเฉพาะอย่างยิ่งเมื่อไม่ได้ใช้ git ชําระเงินเบาบาง, สามารถใช้คําสั่งต่อไปนี้:

เปลือก
# แสดงวัตถุที่หายไป
git rev-list --วัตถุ --ทั้งหมด --หายไป=พิมพ์ | เกรป-อี '^\?'

# แสดงวัตถุที่หายไปโดยไม่มี '?' ตัวละครที่อยู่ตรงหน้าพวกเขา (ต้องการ GNU grep)
git rev-list --วัตถุ --ทั้งหมด --หายไป=พิมพ์ | เกรป -โอพี '^\?\K\w+'

# ดึงวัตถุที่หายไป
git ดึงต้นกําเนิด $(git rev-list --วัตถุ --ทั้งหมด --หายไป=พิมพ์ | เกรป -โอพี '^\?\K\w+')

# แสดงจํานวนวัตถุที่หายไป
git rev-list --วัตถุ --ทั้งหมด --หายไป=พิมพ์ | เกรป-อี '^\?' | ห้องน้ํา -l
บรรจุใหม่ทุกอย่าง ซึ่งสามารถทําได้โดยใช้ git repack -a -d, ตัวอย่างเช่น นี้ ควรเหลือไว้เพียงสามไฟล์เท่านั้น .git/วัตถุ/แพ็ค/:

ก แพ็ค-<SHA1>.แพ็ค ไฟล์
มันสอดคล้องกัน แพ็ค-<SHA1>.idx ไฟล์
ก แพ็ค-<SHA1>.promisor ไฟล์
ลบ .โปรโมเตอร์ ไฟล์ ขั้นตอนก่อนหน้านี้น่าจะเหลือเพียงขั้นตอนเดียวเท่านั้น แพ็ค-<SHA1>.promisor ไฟล์ซึ่งควรจะว่างเปล่าและควรลบออก

ลบการกําหนดค่าโคลนบางส่วน การกําหนดค่าที่เกี่ยวข้องกับโคลนบางส่วน ควรลบตัวแปรออกจากไฟล์การกําหนดค่า Git โดยปกติจะมีเพียงสิ่งต่อไปนี้ การกําหนดค่าจะต้องถูกลบออก:

remote.origin.promisor●
