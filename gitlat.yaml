
ใช้ GitLab
ใช้คอมไพล์
การดําเนินงานขั้นพื้นฐาน
โคลนพื้นที่เก็บข้อมูล
ช่วยให้เราเรียนรู้เกี่ยวกับประสบการณ์ปัจจุบันของคุณกับเอกสารประกอบ ทําแบบสํารวจ●
โคลนพื้นที่เก็บข้อมูล Git ไปยังคอมพิวเตอร์ในพื้นที่ของคุณ
คุณสามารถโคลนพื้นที่เก็บข้อมูล Git ไปยังคอมพิวเตอร์ในเครื่องของคุณได้ การดําเนินการนี้จะสร้างสําเนาของพื้นที่เก็บข้อมูลและ สร้างการเชื่อมต่อที่ซิงโครไนซ์การเปลี่ยนแปลงระหว่างคอมพิวเตอร์ของคุณและเซิร์ฟเวอร์ GitLab การเชื่อมต่อนี้ต้องการให้คุณเพิ่มข้อมูลประจําตัว คุณสามารถอย่างใดอย่างหนึ่ง โคลนด้วย SSH หรือ โคลนด้วย HTTPS● SSH เป็นวิธีการตรวจสอบสิทธิ์ที่แนะนํา

การโคลนพื้นที่เก็บข้อมูล:

ดาวน์โหลดไฟล์โครงการ ประวัติ และข้อมูลเมตาทั้งหมดไปยังเครื่องในพื้นที่ของคุณ
สร้างไดเร็กทอรีการทํางานพร้อมไฟล์เวอร์ชันล่าสุด
ตั้งค่าการติดตามระยะไกลเพื่อซิงโครไนซ์การเปลี่ยนแปลงในอนาคต
ให้การเข้าถึงแบบออฟไลน์ไปยังโค้ดเบสที่สมบูรณ์
สร้างรากฐานสําหรับการสนับสนุนโค้ดกลับไปยังโครงการ
โคลนกับ SSH
โคลนด้วย SSH เมื่อคุณต้องการตรวจสอบสิทธิ์เพียงครั้งเดียว

ตรวจสอบสิทธิ์ด้วย GitLab โดยทําตามคําแนะนําใน เอกสาร SSH●

ในแถบด้านบน ให้เลือก ค้นหาหรือไปที่ และค้นหาโครงการที่คุณต้องการโคลน

ในหน้าภาพรวมของโครงการ ที่มุมขวาบน ให้เลือก รหัส, จากนั้นคัดลอก URL สําหรับ โคลนกับ SSH●

เปิดเทอร์มินัลและไปที่ไดเร็กทอรีที่คุณต้องการโคลนไฟล์ Git จะสร้างโฟลเดอร์ที่มีชื่อพื้นที่เก็บข้อมูลโดยอัตโนมัติและดาวน์โหลดไฟล์ที่นั่น

เรียกใช้คําสั่งนี้:

เปลือก
คอมไพล์โคลน < URL ที่คัดลอก>
หากต้องการดูไฟล์ให้ไปที่ไดเรกทอรีใหม่:

เปลือก
ซีดี <ไดเรกทอรีใหม่>
โคลนพร้อม HTTPS
โคลนด้วย HTTPS เมื่อคุณต้องการตรวจสอบสิทธิ์ทุกครั้งที่คุณดําเนินการระหว่างคอมพิวเตอร์และ GitLab ตัวช่วยข้อมูลรับรอง OAuth สามารถลดลง จํานวนครั้งที่คุณต้องตรวจสอบสิทธิ์ด้วยตนเอง ทําให้ HTTPS เป็นประสบการณ์ที่ราบรื่น

ในแถบด้านบน ให้เลือก ค้นหาหรือไปที่ และค้นหาโครงการที่คุณต้องการโคลน

ในหน้าภาพรวมของโครงการ ที่มุมขวาบน ให้เลือก รหัส, จากนั้นคัดลอก URL สําหรับ โคลนพร้อม HTTPS●

เปิดเทอร์มินัลและไปที่ไดเร็กทอรีที่คุณต้องการโคลนไฟล์

เรียกใช้คําสั่งต่อไปนี้ Git จะสร้างโฟลเดอร์ที่มีชื่อพื้นที่เก็บข้อมูลโดยอัตโนมัติและดาวน์โหลดไฟล์ที่นั่น

เปลือก
คอมไพล์โคลน < URL ที่คัดลอก>
ตรวจสอบคําขอของคุณ

หากคุณเปิดใช้งานการตรวจสอบสิทธิ์แบบสองปัจจัย (2FA) คุณจะไม่สามารถใช้การตรวจสอบสิทธิ์ชื่อผู้ใช้และรหัสผ่านได้ แทน:

ใช้โทเค็น กับ read_repositive หรือ write_repository การอนุญาต
ติดตั้ง ตัวช่วยข้อมูลรับรอง OAuth
หากต้องการดูไฟล์ให้ไปที่ไดเรกทอรีใหม่:

เปลือก
ซีดี <ไดเรกทอรีใหม่>
บน Windows หากคุณป้อนรหัสผ่านไม่ถูกต้องหลายครั้งและ การเข้าถึงถูกปฏิเสธ ข้อความปรากฏขึ้น, เพิ่มเนมสเปซของคุณ (ชื่อผู้ใช้หรือกลุ่ม) ไปยังเส้นทาง: git โคลน https://namespace@gitlab.com/gitlab-org/gitlab.git●

โคลนโดยใช้โทเค็น
โคลนด้วย HTTPS โดยใช้โทเค็นถ้า:

คุณต้องการใช้ 2FA
คุณต้องการให้มีชุดข้อมูลประจําตัวที่เพิกถอนได้ซึ่งจํากัดขอบเขตไปยังที่เก็บข้อมูลตั้งแต่หนึ่งแห่งขึ้นไป
คุณสามารถใช้โทเค็นเหล่านี้เพื่อตรวจสอบสิทธิ์เมื่อทําการโคลนบน HTTPS:

โทเค็นการเข้าถึงส่วนบุคคล●
ปรับใช้โทเค็น●
โทเค็นการเข้าถึงโครงการ●
โทเค็นการเข้าถึงกลุ่ม●
ตัวอย่างเช่น:

เปลือก
git โคลน https://<username>:<token>@gitlab.example.com/tanuki/awesome_project.git
โคลนและเปิดใน Apple Xcode
โครงการที่มีก .xcodeproj หรือ .xcworkspace ไดเรกทอรีสามารถโคลนได้ ลงใน Xcode บน macOS

จาก GitLab UI ไปที่หน้าภาพรวมของโครงการ
ที่มุมขวาบน ให้เลือก รหัส●
เลือก เอ็กซ์โค้ด●
โปรเจ็กต์ถูกโคลนลงในคอมพิวเตอร์ของคุณและคุณก็เป็นเช่นนั้น ได้รับแจ้งให้เปิด Xcode

โคลนและเปิดใน Visual Studio Code
โปรเจ็กต์ทั้งหมดสามารถโคลนเป็น Visual Studio Code ได้จากอินเทอร์เฟซผู้ใช้ GitLab แต่คุณ สามารถติดตั้งได้ด้วย GitLab สําหรับส่วนขยาย VS Code เพื่อโคลนจาก รหัสสตูดิโอภาพ

ข้อกําหนดเบื้องต้น:

รหัสสตูดิโอภาพ ต้องติดตั้งบนเครื่องท้องถิ่นของคุณ ไม่รองรับ VS Code เวอร์ชันอื่นๆ เช่น VS Code Insiders และ VSCodium
กําหนดค่าเบราว์เซอร์ของคุณสําหรับโปรโตคอล IDE●
จากอินเทอร์เฟซ GitLab:
ไปที่หน้าภาพรวมของโครงการ

ที่มุมขวาบน ให้เลือก รหัส●

ภายใต้ เปิดใน IDE ของคุณ, เลือก รหัสสตูดิโอภาพ (SSH) หรือ รหัสสตูดิโอภาพ (HTTPS)●

เลือกโฟลเดอร์ที่จะโคลนโครงการลงใน

หลังจากที่ Visual Studio Code โคลนโปรเจ็กต์ของคุณแล้ว ระบบจะเปิดโฟลเดอร์

จาก Visual Studio Code ด้วย ส่วนขยาย ติดตั้งแล้วใช้ ส่วนขยาย คอมไพล์: โคลน คําสั่ง●
โคลนและเปิดใน IntelliJ IDEA
โครงการทั้งหมดสามารถโคลนเข้าไปได้ อินเทลลีเจ ไอเดีย จากอินเทอร์เฟซผู้ใช้ GitLab

ข้อกําหนดเบื้องต้น:

อินเทลลีเจ ไอเดีย ต้องติดตั้งบนเครื่องท้องถิ่นของคุณ
กําหนดค่าเบราว์เซอร์ของคุณสําหรับโปรโตคอล IDE●
ในการทําเช่นนี้:

ไปที่หน้าภาพรวมของโครงการ
ที่มุมขวาบน ให้เลือก รหัส●
ภายใต้ เปิดใน IDE ของคุณ, เลือก IntelliJ IDEA (SSH) หรือ IntelliJ IDEA (HTTPS)●
กําหนดค่าเบราว์เซอร์สําหรับโปรโตคอล IDE
เพื่อให้มั่นใจว่า เปิดใน IDE คุณลักษณะกําลังทํางานอยู่ คุณต้องกําหนดค่าเบราว์เซอร์ของคุณให้จัดการ โปรโตคอลแอปพลิเคชันแบบกําหนดเอง เช่น วีเอสโค้ด:// หรือ เจ็ทเบรนส์://●

ไฟร์ฟอกซ์
Firefox จัดการโปรโตคอลที่กําหนดเองโดยอัตโนมัติหากมีการติดตั้งแอปพลิเคชันที่จําเป็นในระบบของคุณ เมื่อคุณเลือกลิงก์โปรโตคอลแบบกําหนดเองเป็นครั้งแรก กล่องโต้ตอบจะเปิดขึ้นและถามว่าคุณต้องการหรือไม่ เพื่อเปิดแอปพลิเคชัน เลือก เปิดลิงค์ เพื่อให้ Firefox เปิดแอปพลิเคชันได้

หากคุณไม่ต้องการรับการแจ้งเตือนอีกครั้ง ให้เลือกช่องทําเครื่องหมายเพื่อจดจําตัวเลือกของคุณ

หากกล่องโต้ตอบพร้อมท์ไม่เปิดขึ้นคุณต้องกําหนดค่า Firefox ด้วยตนเอง:

เปิดไฟร์ฟอกซ์
ที่มุมขวาบน ให้เลือก เปิดเมนูแอพพลิเคชั่น (  )
ค้นหาหรือไปที่ แอพพลิเคชั่น ส่วน
ค้นหาและเลือกแอปพลิเคชันที่คุณต้องการในรายการ ตัวอย่างเช่น วีเอสโค้ด หรือ เจ็ทเบรนส์●
เลือก Visual Studio Code หรือ IntelliJ IDEA จากรายการแบบเลื่อนลง หรือเลือก ใช้อื่น ๆ เพื่อค้นหาไฟล์ปฏิบัติการ
หาก IDE ที่คุณต้องการไม่อยู่ในรายการ คุณจะได้รับแจ้งให้เลือกแอปพลิเคชันในครั้งแรกที่คุณเลือกลิงก์ที่เกี่ยวข้อง

โครม
Chrome จัดการโปรโตคอลที่กําหนดเองโดยอัตโนมัติหากมีการติดตั้งแอปพลิเคชันที่จําเป็นในระบบของคุณ เมื่อคุณเลือกลิงก์โปรโตคอลแบบกําหนดเองใน Chrome เป็นครั้งแรก กล่องโต้ตอบจะเปิดขึ้นและถามว่าคุณต้องการหรือไม่ เพื่อเปิดแอปพลิเคชัน เลือก เปิด เพื่อให้โครมเปิดแอพพลิเคชั่นได้

หากคุณไม่ต้องการรับการแจ้งเตือนอีกครั้ง ให้เลือกช่องทําเครื่องหมายเพื่อจดจําตัวเลือกของคุณ

ลดขนาดโคลน
เมื่อพื้นที่เก็บข้อมูล Git มีขนาดใหญ่ขึ้น ก็อาจยุ่งยากในการทํางาน เพราะ:

ประวัติจํานวนมากที่ต้องดาวน์โหลด
พื้นที่ดิสก์จํานวนมากที่พวกเขาต้องการ
โคลนบางส่วน คือการเพิ่มประสิทธิภาพการทํางานที่ช่วยให้ Git สามารถทํางานได้โดยไม่ต้องมี สําเนาที่สมบูรณ์ของพื้นที่เก็บข้อมูล เป้าหมายของงานนี้คือเพื่อให้ Git ดีขึ้น จัดการพื้นที่เก็บข้อมูลขนาดใหญ่มาก

ต้องใช้ Git 2.22.0 หรือใหม่กว่า

กรองตามขนาดไฟล์
การจัดเก็บไฟล์ไบนารีขนาดใหญ่ใน Git มักจะไม่สนับสนุน เนื่องจากไฟล์ขนาดใหญ่ทุกไฟล์ ไฟล์ที่เพิ่มจะถูกดาวน์โหลดโดยทุกคนที่โคลนหรือดึงการเปลี่ยนแปลง หลังจากนั้น การดาวน์โหลดเหล่านี้ช้าและเป็นปัญหา โดยเฉพาะอย่างยิ่งเมื่อทํางานจากช้า หรือการเชื่อมต่ออินเทอร์เน็ตที่ไม่น่าเชื่อถือ

การใช้โคลนบางส่วนกับตัวกรองขนาดไฟล์จะช่วยแก้ปัญหานี้ได้ โดยการยกเว้น ไฟล์ขนาดใหญ่ที่มีปัญหาจากโคลนและดึงข้อมูล เมื่อกิตพบกับความหายไป ไฟล์ มันถูกดาวน์โหลดตามความต้องการ

เมื่อโคลนพื้นที่เก็บข้อมูล ให้ใช้ --filter=blob:limit=<size> อาร์กิวเมนต์ ตัวอย่างเช่น ในการโคลนพื้นที่เก็บข้อมูลไม่รวมไฟล์ที่มีขนาดใหญ่กว่า 1 เมกะไบต์:

เปลือก
git โคลน --ตัวกรอง=หยด:จํากัด=1m git@gitlab.com:gitlab-com/www-gitlab-com.git
