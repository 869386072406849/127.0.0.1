ทําไมฉันต้องมีจรรยาบรรณ?
หลักจรรยาบรรณคือเอกสารที่สร้างความคาดหวังต่อพฤติกรรมของผู้เข้าร่วมโครงการของคุณ การยอมรับและการบังคับใช้หลักจรรยาบรรณสามารถช่วยสร้างบรรยากาศทางสังคมเชิงบวกให้กับชุมชนของคุณได้

หลักจรรยาบรรณช่วยปกป้องไม่เพียงแต่ผู้เข้าร่วมของคุณเท่านั้น แต่ยังช่วยปกป้องตัวคุณเองด้วย หากคุณรักษาโครงการไว้ คุณอาจพบว่าทัศนคติที่ไม่เกิดผลจากผู้เข้าร่วมคนอื่นๆ อาจทําให้คุณรู้สึกเหนื่อยล้าหรือไม่มีความสุขกับงานเมื่อเวลาผ่านไป

หลักจรรยาบรรณช่วยให้คุณอํานวยความสะดวกให้กับพฤติกรรมชุมชนที่ดีและสร้างสรรค์ การดําเนินการเชิงรุกจะช่วยลดโอกาสที่คุณหรือคนอื่นๆ จะเหนื่อยล้าจากโครงการของคุณ และช่วยให้คุณดําเนินการเมื่อมีคนทําสิ่งที่คุณไม่เห็นด้วย

การกําหนดจรรยาบรรณ
พยายามสร้างจรรยาบรรณโดยเร็วที่สุด: ตามหลักการแล้ว เมื่อคุณสร้างโครงการครั้งแรก

นอกเหนือจากการสื่อสารความคาดหวังของคุณแล้วจรรยาบรรณยังอธิบายสิ่งต่อไปนี้:

ในกรณีที่จรรยาบรรณมีผลใช้บังคับ (เฉพาะในประเด็นและดึงคําขอหรือกิจกรรมชุมชนเช่นกิจกรรม?)
ซึ่งจรรยาบรรณใช้บังคับกับ (สมาชิกชุมชนและผู้ดูแล แต่ผู้สนับสนุนล่ะ?)
จะเกิดอะไรขึ้นหากมีคนฝ่าฝืนจรรยาบรรณ
วิธีที่ใครบางคนสามารถรายงานการละเมิดได้
เมื่อใดก็ตามที่คุณสามารถใช้ศิลปะก่อนหน้า เดอะ พันธสัญญาของผู้มีส่วนร่วม เป็นจรรยาบรรณแบบดรอปอินที่ใช้โดยโครงการโอเพ่นซอร์สมากกว่า 40,000 โครงการ รวมถึง Kubernetes, Rails และ Swift

เดอะ หลักจรรยาบรรณของจังโก้ และ หลักจรรยาบรรณของพลเมือง ยังเป็นตัวอย่างจรรยาบรรณที่ดีสองตัวอย่าง

วางไฟล์ CODE_OF_CONDUCT ในไดเร็กทอรีรากของโครงการของคุณ และทําให้ชุมชนของคุณมองเห็นได้โดยการเชื่อมโยงจากไฟล์ที่มีส่วนร่วมหรือ README ของคุณ

การตัดสินใจว่าคุณจะบังคับใช้หลักจรรยาบรรณของคุณอย่างไร
หลักจรรยาบรรณที่ไม่ได้ (หรือไม่สามารถบังคับใช้ได้) นั้นแย่กว่าการไม่มีหลักจรรยาบรรณเลย: เป็นการส่งข้อความว่าคุณค่าในหลักจรรยาบรรณไม่สําคัญหรือเคารพในชุมชนของคุณจริงๆ

— ความคิดริเริ่มของเอดา

คุณควรอธิบายว่าจรรยาบรรณของคุณจะถูกบังคับใช้อย่างไร ก่อน เกิดการละเมิด มีเหตุผลหลายประการในการทําเช่นนั้น:

มันแสดงให้เห็นว่าคุณจริงจังกับการดําเนินการเมื่อจําเป็น

ชุมชนของคุณจะรู้สึกมั่นใจมากขึ้นว่าข้อร้องเรียนได้รับการตรวจสอบจริง

คุณจะสร้างความมั่นใจให้กับชุมชนของคุณว่ากระบวนการตรวจสอบนั้นยุติธรรมและโปร่งใส หากพวกเขาพบว่าตนเองถูกสอบสวนว่ามีการละเมิดหรือไม่

คุณควรให้วิธีส่วนตัวแก่ผู้คน (เช่น ที่อยู่อีเมล) เพื่อรายงานการละเมิดจรรยาบรรณและอธิบายว่าใครได้รับรายงานนั้น อาจเป็นผู้ดูแล กลุ่มผู้ดูแล หรือคณะทํางานด้านจรรยาบรรณ

อย่าลืมว่าอาจมีคนต้องการรายงานการละเมิดเกี่ยวกับบุคคลที่ได้รับรายงานเหล่านั้น ในกรณีนี้ ให้ทางเลือกแก่พวกเขาในการรายงานการละเมิดต่อบุคคลอื่น ตัวอย่างเช่น @ctb และ @mr-c อธิบายเกี่ยวกับโครงการของพวกเขา, เขมร:

กรณีของพฤติกรรมที่ไม่เหมาะสม คุกคาม หรือยอมรับไม่ได้อาจถูกรายงานโดยการส่งอีเมล khmer-project@idyll.org ซึ่งตกเป็นของ ซี. ไททัส บราวน์ และ ไมเคิล อาร์. ครูโซ เท่านั้น หากต้องการรายงานปัญหาที่เกี่ยวข้องกับฝ่ายใดฝ่ายหนึ่ง โปรดส่งอีเมล จูดี บราวน์ คลาร์ก, Ph.D ผู้อํานวยการด้านความหลากหลายที่ศูนย์ BEACON เพื่อการศึกษาวิวัฒนาการในการดําเนินการ ซึ่งเป็นศูนย์วิทยาศาสตร์และเทคโนโลยี NSF*

หากต้องการแรงบันดาลใจ ลองดูของ Django คู่มือการบังคับใช้ (แม้ว่าคุณอาจไม่ต้องการสิ่งที่ครอบคลุมขนาดนี้ ขึ้นอยู่กับขนาดของโครงการของคุณ)

การบังคับใช้จรรยาบรรณของคุณ
บางครั้ง แม้ว่าคุณจะพยายามอย่างเต็มที่แล้ว แต่ก็มีคนทําสิ่งที่ละเมิดโค้ดนี้ มีหลายวิธีในการจัดการกับพฤติกรรมเชิงลบหรือเป็นอันตรายเมื่อเกิดขึ้น

รวบรวมข้อมูลเกี่ยวกับสถานการณ์
ปฏิบัติต่อเสียงของสมาชิกชุมชนแต่ละคนมีความสําคัญพอๆ กับเสียงของคุณเอง หากคุณได้รับรายงานว่ามีคนละเมิดจรรยาบรรณ ให้ดําเนินการอย่างจริงจังและตรวจสอบเรื่องนี้ แม้ว่าจะไม่ตรงกับประสบการณ์ของคุณเองกับบุคคลนั้นก็ตาม การทําเช่นนี้เป็นการส่งสัญญาณไปยังชุมชนของคุณว่าคุณให้ความสําคัญกับมุมมองของพวกเขาและไว้วางใจในการตัดสินของพวกเขา

สมาชิกชุมชนที่เป็นปัญหาอาจเป็นผู้กระทําผิดซ้ําซึ่งทําให้ผู้อื่นรู้สึกไม่สบายใจอยู่เสมอ หรืออาจพูดหรือทําอะไรเพียงครั้งเดียว ทั้งสองอย่างสามารถเป็นเหตุในการดําเนินการได้ ขึ้นอยู่กับบริบท

ก่อนที่คุณจะตอบกลับ ให้เวลาตัวเองเพื่อทําความเข้าใจว่าเกิดอะไรขึ้น อ่านความคิดเห็นและการสนทนาในอดีตของบุคคลนั้นเพื่อทําความเข้าใจให้ดีขึ้นว่าพวกเขาเป็นใครและทําไมพวกเขาถึงกระทําการเช่นนั้น พยายามรวบรวมมุมมองอื่นที่ไม่ใช่ของคุณเองเกี่ยวกับบุคคลนี้และพฤติกรรมของพวกเขา

อย่าถูกดึงเข้าสู่การโต้เถียง อย่าหลงระเริงในการจัดการกับพฤติกรรมของผู้อื่นก่อนที่คุณจะจัดการกับเรื่องที่เกิดขึ้นเสร็จแล้ว มุ่งเน้นไปที่สิ่งที่คุณต้องการ

— สเตฟานี ซวาน, “ดังนั้นคุณจึงมีนโยบายเป็นของตัวเอง ตอนนี้อะไร?”

ดําเนินการที่เหมาะสม
หลังจากรวบรวมและประมวลผลข้อมูลที่เพียงพอ คุณจะต้องตัดสินใจว่าจะทําอย่างไร เมื่อคุณพิจารณาขั้นตอนต่อไป โปรดจําไว้ว่าเป้าหมายของคุณในฐานะผู้ดูแลคือการส่งเสริมสภาพแวดล้อมที่ปลอดภัย ให้ความเคารพ และทํางานร่วมกัน พิจารณาไม่เพียงแต่วิธีจัดการกับสถานการณ์ที่เป็นปัญหาเท่านั้น แต่ยังพิจารณาว่าการตอบสนองของคุณจะส่งผลต่อพฤติกรรมและความคาดหวังที่เหลือของชุมชนของคุณในอนาคตอย่างไร

เมื่อมีคนรายงานการละเมิดหลักจรรยาบรรณ คุณมีหน้าที่จัดการมัน ไม่ใช่พวกเขา บางครั้งนักข่าวกําลังเปิดเผยข้อมูลที่มีความเสี่ยงสูงต่ออาชีพการงาน ชื่อเสียง หรือความปลอดภัยทางกายภาพ การบังคับให้พวกเขาเผชิญหน้ากับผู้ก่อกวนอาจทําให้นักข่าวอยู่ในสถานะประนีประนอม คุณควรจัดการการสื่อสารโดยตรงกับบุคคลที่เป็นปัญหา เว้นแต่นักข่าวจะร้องขอเป็นอย่างอื่นอย่างชัดเจน

มีสองสามวิธีที่คุณอาจตอบสนองต่อการละเมิดจรรยาบรรณ:

แจ้งเตือนบุคคลที่เป็นปัญหาต่อสาธารณะ และอธิบายว่าพฤติกรรมของพวกเขาส่งผลเสียต่อผู้อื่นอย่างไร โดยเฉพาะอย่างยิ่งในช่องทางที่มันเกิดขึ้น หากเป็นไปได้ การสื่อสารสาธารณะจะสื่อให้ชุมชนอื่นๆ ทราบว่าคุณให้ความสําคัญกับหลักจรรยาบรรณอย่างจริงจัง ใจดี แต่หนักแน่นในการสื่อสารของคุณ

เข้าถึงบุคคลเป็นการส่วนตัว เป็นคําถามเพื่ออธิบายว่าพฤติกรรมของพวกเขาส่งผลเสียต่อผู้อื่นอย่างไร คุณอาจต้องการใช้ช่องทางการสื่อสารส่วนตัวหากสถานการณ์เกี่ยวข้องกับข้อมูลส่วนบุคคลที่ละเอียดอ่อน หากคุณสื่อสารกับใครบางคนเป็นการส่วนตัว เป็นความคิดที่ดีที่จะ CC ผู้ที่รายงานสถานการณ์เป็นครั้งแรก เพื่อให้พวกเขารู้ว่าคุณได้ดําเนินการแล้ว ขอความยินยอมจากผู้รายงานก่อนที่จะ CC

บางครั้งก็ไม่สามารถบรรลุข้อยุติได้ บุคคลที่เป็นปัญหาอาจก้าวร้าวหรือเป็นศัตรูเมื่อเผชิญหน้าหรือไม่เปลี่ยนพฤติกรรม ในสถานการณ์เช่นนี้ คุณอาจต้องการพิจารณาดําเนินการที่เข้มแข็งยิ่งขึ้น ตัวอย่างเช่น:

ระงับบุคคล ที่เป็นปัญหาจากโครงการ บังคับใช้ผ่านการห้ามชั่วคราวในการเข้าร่วมในทุกด้านของโครงการ

ห้ามอย่างถาวร บุคคลจากโครงการ

การห้ามสมาชิกไม่ควรถือเป็นเรื่องเบา ๆ และแสดงถึงความแตกต่างทางมุมมองอย่างถาวรและเข้ากันไม่ได้ คุณควรใช้มาตรการเหล่านี้เมื่อเห็นได้ชัดว่าไม่สามารถบรรลุข้อยุติได้

ความรับผิดชอบของคุณในฐานะผู้ดูแล
จรรยาบรรณไม่ใช่กฎหมายที่บังคับใช้ตามอําเภอใจ คุณเป็นผู้บังคับใช้หลักจรรยาบรรณและเป็นความรับผิดชอบของคุณที่จะต้องปฏิบัติตามกฎที่หลักจรรยาบรรณกําหนดไว้

ในฐานะผู้ดูแล คุณกําหนดแนวปฏิบัติสําหรับชุมชนของคุณและบังคับใช้แนวปฏิบัติเหล่านั้นตามกฎที่กําหนดไว้ในจรรยาบรรณของคุณ นี่หมายถึงการรายงานการละเมิดหลักจรรยาบรรณอย่างจริงจัง นักข่าวเป็นหนี้การตรวจสอบข้อร้องเรียนของพวกเขาอย่างละเอียดและยุติธรรม หากคุณพบว่าพฤติกรรมที่พวกเขารายงานไม่ใช่การละเมิด ให้สื่อสารอย่างชัดเจนกับพวกเขา และอธิบายว่าทําไมคุณไม่ดําเนินการใดๆ กับพฤติกรรมนั้น สิ่งที่พวกเขาทํานั้นขึ้นอยู่กับพวกเขา: อดทนต่อพฤติกรรมที่พวกเขามีปัญหาหรือหยุดมีส่วนร่วมในชุมชน

รายงานพฤติกรรมที่ไม่ ในทางเทคนิค การละเมิดจรรยาบรรณอาจยังบ่งชี้ว่ามีปัญหาในชุมชนของคุณ และคุณควรตรวจสอบปัญหาที่อาจเกิดขึ้นนี้และดําเนินการตามนั้น ซึ่งอาจรวมถึงการแก้ไขหลักจรรยาบรรณของคุณเพื่อชี้แจงพฤติกรรมที่ยอมรับได้ และ/หรือการพูดคุยกับบุคคลที่มีการรายงานพฤติกรรม และบอกพวกเขาว่าแม้ว่าพวกเขาจะไม่ละเมิดหลักจรรยาบรรณ แต่พวกเขาก็กําลังหลบเลี่ยงสิ่งที่คาดหวังและกําลังทําให้บางอย่าง ผู้เข้าร่วมรู้สึกไม่สบายใจ

ในท้ายที่สุด ในฐานะผู้ดูแล คุณได้กําหนดและบังคับใช้มาตรฐานสําหรับพฤติกรรมที่ยอมรับได้ คุณมีความสามารถในการกําหนดคุณค่าของชุมชนของโครงการ และผู้เข้าร่วมคาดหวังให้คุณบังคับใช้คุณค่าเหล่านั้นอย่างยุติธรรมและเท่าเทียมกัน

ส่งเสริมพฤติกรรมที่คุณอยากเห็นในโลก 🌎
เมื่อโปรเจ็กต์ดูไม่เป็นมิตรหรือไม่เป็นที่ต้อนรับ แม้ว่าจะเป็นเพียงคนเดียวที่ผู้อื่นยอมรับพฤติกรรมได้ คุณก็เสี่ยงที่จะสูญเสียผู้ร่วมให้ข้อมูลอีกหลายคน ซึ่งบางคนคุณอาจไม่เคยพบด้วยซ้ํา การนําหรือบังคับใช้หลักจรรยาบรรณไม่ใช่เรื่องง่ายเสมอไป แต่การส่งเสริมสภาพแวดล้อมที่เป็นมิตรจะช่วยให้ชุมชนของคุณเติบโต
