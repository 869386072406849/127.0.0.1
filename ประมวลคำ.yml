หลักสูตรข้อความเป็นข้อมูล
เอกสารประกอบการเรียนวิชา "ข้อความในฐานะข้อมูล" ที่มหาวิทยาลัยเพนน์สเตทและเอสเซ็กซ์

ดูรายละเอียดโครงการได้ที่ GitHub burtmonroe/TextAsDataCourse

เครื่องมือโอเพนซอร์สสำหรับแปลงข้อความเป็นข้อมูล / การประมวลผลภาษาธรรมชาติ (NLP) ในภาษา Python
หมายเหตุสำหรับนักศึกษาในหลักสูตร Text as Data/NLP ของผมที่ Penn State / Essex

เจเนริกของ Python
ผมขอแนะนำอย่างยิ่งให้ใช้ระบบปฏิบัติการ Anaconda และตัวจัดการแพ็กเกจ Conda ครับ
Google Colab - คุณยังสามารถใช้ Google Colab เป็นพื้นที่ฟรีสำหรับพัฒนาและแชร์โค้ด Python ในรูปแบบโน้ตบุ๊กได้อีกด้วย ซึ่งมีประโยชน์อย่างยิ่งในการเข้าถึงการประมวลผล GPU หรือ TPU ได้ฟรี ซึ่งจำเป็นสำหรับการสร้างแบบจำลองโครงข่ายประสาทเทียมที่มีความซับซ้อนปานกลาง
โดยส่วนใหญ่แล้ว หากคุณเพิ่งเริ่มเรียน Python คุณควรใช้ Python 3 ซึ่งในขณะที่เขียนบทความนี้คือเวอร์ชัน 3.9 ขึ้นไป แต่โปรดทราบว่ามีการเขียนโปรแกรมจำนวนมากใน Python 2 โดยเฉพาะเวอร์ชัน 2.7 และมีความแตกต่างที่สำคัญอยู่หลายประการ นอกเหนือจากความแตกต่างทางไวยากรณ์ทั่วไปแล้ว ประเด็นหลักในการวิเคราะห์ข้อความคือการจัดการกับการเข้ารหัส (เช่น UTF-8)
นอกจากนี้ คุณควรเรียนรู้วิธีการตั้งค่า "สภาพแวดล้อม" สำหรับการใช้งาน Python เวอร์ชันและแพ็กเกจต่างๆ วิธีนี้จะช่วยให้สามารถทำซ้ำได้และช่วยในการทดลองใช้แพ็กเกจต่างๆ โดยไม่ทำให้ส่วนอื่นๆ ที่ใช้งานได้อยู่แล้วเสียหาย
ชีวิตจะง่ายขึ้นถ้าคุณใช้ IDE สำหรับ Python ที่ดี ผมชอบ PyCharm (https://www.jetbrains.com/pycharm/)
“NumPy stack” คือไลบรารีพื้นฐานสำหรับการคำนวณเชิงตัวเลข การคำนวณทางวิทยาศาสตร์ และวิทยาศาสตร์ข้อมูลในภาษา Python ติดตั้งโดยอัตโนมัติพร้อมกับ Anaconda
NumPy - ให้บริการออบเจ็กต์อาร์เรย์/เมทริกซ์ และโมดูลสำหรับการดำเนินการกับออบเจ็กต์เหล่านั้น (ดูเพิ่มเติมที่ Numba - แปลง NumPy และโค้ดที่เกี่ยวข้องให้เป็นโค้ดเครื่องจักรเพื่อการประมวลผลที่เร็วขึ้นมาก) (ดูเพิ่มเติมที่ CuPy ซึ่งเป็นทางเลือกอื่นของ NumPy ที่ใช้การเร่งความเร็ว NVIDIA CUDA) (ดูเพิ่มเติมที่ PyTorch ซึ่งจะกล่าวถึงด้านล่าง)
SciPy (“Sigh Pie”) - การคำนวณทางวิทยาศาสตร์ … พีชคณิตเชิงเส้น การหาค่าเหมาะสมที่สุด การอินทิเกรต การประมวลผลสัญญาณ
pandas - อ็อบเจ็กต์ตาราง DataFrame และการจัดการข้อมูล (การอ่านเขียนไฟล์ การปรับรูปร่างข้อมูล การแบ่ง-ประยุกต์-รวม); แบบจำลองอนุกรมเวลาและแบบจำลองทางเศรษฐศาสตร์ (ดูเพิ่มเติมที่ Dask - การประมวลผลแบบขนาน; อ็อบเจ็กต์ "บิ๊กดาต้า" ที่ขยายจาก NumPy, อ็อบเจ็กต์ pandas; ตัวจัดการเวิร์กโฟลว์)
matplotlib - สำหรับการสร้างกราฟ/กราฟิก ส่วนตัวแล้วผมชอบไลบรารีเสริม “seaborn” (https://seaborn.pydata.org) มากกว่า เพราะมันคล้ายกับภาษา R มากกว่า ไลบรารีสำหรับการแสดงภาพข้อมูลอื่นๆ ที่ติดตั้งมาพร้อมกับ Anaconda ได้แก่ Bokeh (แบบโต้ตอบ สำหรับเว็บเบราว์เซอร์), Datashader (สำหรับข้อมูลขนาดใหญ่), HoloViews (ส่วนหน้าขั้นสูงสำหรับ matplotlib, Bokeh และอื่นๆ สามารถใช้ Datashader ได้เช่นกัน), GeoViews (สำหรับข้อมูลทางภูมิศาสตร์) ไลบรารีเหล่านี้และอื่นๆ ถูกรวมอยู่ในโครงการ “PyViz ecosystem” (https://pyviz.org/index.html) ซึ่งได้รับการสนับสนุนโดย Anaconda
scikit-learn - ไลบรารีแมชชีนเลิร์นนิง (ที่ไม่ใช้โครงข่ายประสาทเทียม) ที่ได้รับความนิยม ใช้สำหรับวิเคราะห์การถดถอย การจำแนกประเภท การจัดกลุ่ม การประเมินผล ฯลฯ
SymPy - การคำนวณเชิงสัญลักษณ์ (พีชคณิต แคลคูลัส) (โดยทั่วไปไม่ได้ใช้ในงานด้านข้อความ/การประมวลผลภาษาธรรมชาติ)
Cython - ในทางเทคนิคแล้วเป็นภาษาเฉพาะของตัวเอง เป็นการผสมผสานระหว่าง Python และ C สร้างโมดูล Python ที่ถูกนำไปใช้งานใน C/C++ ซึ่งทำให้ทำงานได้เร็วกว่ามาก ตัวอย่างเช่น SpaCy เขียนด้วย Cython เช่นเดียวกับหลายส่วนของ SciPy, pandas และ scikit-learn (คุณอาจพบ Jython ด้วยเช่นกัน ซึ่งเป็นการใช้งาน Python บน Java เนื่องจากมีเครื่องมือ NLP/วิทยาศาสตร์ข้อมูลจำนวนมากที่สร้างขึ้นด้วย Java)
การใช้งานร่วมกับ R คุณสามารถใช้โค้ด R และเข้าถึงอ็อบเจ็กต์ R ภายในกระบวนการ Python ผ่านไลบรารี rpy2 ของ Python คุณสามารถใช้โค้ด Python และเข้าถึงอ็อบเจ็กต์ Python ภายในกระบวนการ R ผ่านไลบรารี reticulate ของ R สามารถใช้ R ร่วมกับสมุดบันทึก Python ใน Jupyter หรือ Colab ได้ และสามารถใช้ Python ร่วมกับสมุดบันทึก R ใน RStudio ได้
ไลบรารีประมวลผลข้อความ
ดูสมุดบันทึกการจัดการข้อความ Python สำหรับการดำเนินการพื้นฐานกับตัวแปรประเภท str การดำเนินการสตริงทั่วไปด้วยโมดูล string การจับคู่รูปแบบด้วยนิพจน์ปกติในโมดูล re และการจัดการและการทำให้สตริง Unicode เป็นมาตรฐานด้วยโมดูล unicodedata

NLP และการสร้างแบบจำลองข้อความ
spaCy - https://spacy.io
“การประมวลผลภาษาธรรมชาติระดับอุตสาหกรรม” spaCy เป็นเครื่องมือมาตรฐานสำหรับการทำงานด้าน NLP เช่น การระบุส่วนของคำพูดและการวิเคราะห์ความสัมพันธ์ของคำ โดยเฉพาะในภาคอุตสาหกรรม (แม้ว่าผลสำรวจในปี 2020 จะระบุว่า SparkNLP ถูกใช้งานอย่างแพร่หลายมากกว่า ซึ่งผมคิดว่าไม่น่าเชื่อ: https://gradientflow.com/2020nlpsurvey/)
แปลงบางส่วนเป็นภาษา R ผ่านทาง spacyr
เร็วกว่า NLTK สำหรับงานส่วนใหญ่ ปรับขนาดได้ อยู่ระหว่างการพัฒนาอย่างต่อเนื่อง / มีชุมชนขนาดใหญ่
NLP: การแบ่งคำ, การระบุเอนทิตีที่มีชื่อ, การระบุส่วนของคำพูด, การวิเคราะห์ความสัมพันธ์ของคำ, การแบ่งประโยคตามไวยากรณ์, การฝังคำที่ฝึกฝนไว้ล่วงหน้า มีโมเดลสำหรับ 17 ภาษา ณ ขณะเขียนบทความนี้ โมเดลเหล่านี้สร้างขึ้นจากโครงข่ายประสาทเทียมแบบคอนโวลูชัน
สามารถทำงานร่วมกับ numpy และ AI/machine learning รวมถึง deep learning (TensorFlow, PyTorch, scikit-learn, Gensim) ได้
มีโปรแกรมแสดงผลข้อมูล (ผ่าน displaCy) สำหรับการตรวจสอบไวยากรณ์และการระบุชื่อเอนทิตี (NER) ในตัว
เหมาะหากคุณต้องการโมเดลที่ปรับให้เหมาะสมกับงานที่กำหนดไว้แล้ว ไม่ค่อยเหมาะสำหรับการวิจัยเกี่ยวกับโมเดลที่แตกต่างกัน มีความยืดหยุ่นน้อยกว่า NLTK
เร็วกว่า UDPipe แต่รองรับภาษาได้น้อยกว่า และมักมีความแม่นยำน้อยกว่า UDPipe เล็กน้อย ผู้เขียน Stanza อ้างว่ามันมีความแม่นยำน้อยกว่า Stanza
ส่วนขยาย: Thinc, sense2vec, displaCy
(ผมได้ใช้ spaCy ในหลายโปรเจกต์ล่าสุด)
NLTK (Natural Language Toolkit) - http://www.nltk.org
เป็นไลบรารี NLP ที่ได้รับการยอมรับมากที่สุด มีเครื่องมือมากมายสำหรับงาน NLP หลากหลายประเภทในหลายภาษา ปรับแต่ง/แก้ไข/ขยายได้ง่ายกว่า spaCy มาก มีชุมชนผู้ใช้ขนาดใหญ่ ตัวอย่างมากมาย ฯลฯ
อาจทำงานช้า ไม่ได้บูรณาการกับวิธีการโครงข่ายประสาทเทียม/การฝังคำ และไม่ทันสมัยเหมือนเมื่อก่อนแล้ว
การจำแนกประเภท, การแยกคำ, การตัดคำรากศัพท์, การติดแท็ก, การวิเคราะห์ไวยากรณ์, การให้เหตุผลเชิงความหมาย
มีส่วนเชื่อมต่อกับ “คลังข้อมูลและแหล่งข้อมูลคำศัพท์มากกว่า 50 รายการ เช่น WordNet”
หนังสือฟรี: Steven Bird, Ewan Klein และ Edward Loper. “การประมวลผลภาษาธรรมชาติด้วย Python – การวิเคราะห์ข้อความด้วย Natural Language Toolkit” ฉบับปรับปรุงสำหรับ Python 3 และ NLTK3: http://www.nltk.org/book
(ผมเคยใช้ NLTK ในโปรเจ็กต์เก่าๆ หลายโปรเจ็กต์)
Stanza (เดิมชื่อ StanfordNLP) - https://stanfordnlp.github.io/stanza/
“แพ็กเกจ Python NLP สำหรับภาษาต่างๆ ของมนุษย์” จาก Stanford NLP Group
การแบ่งคำเป็นโทเค็น การขยายโทเค็นหลายคำ (MWT) การหาคำหลัก การระบุส่วนของคำพูด (POS) และคุณลักษณะทางสัณฐานวิทยา การวิเคราะห์ความสัมพันธ์ทางไวยากรณ์ และการระบุชื่อเอนทิตี
โมเดลโครงข่ายประสาทเทียมที่ผ่านการฝึกฝนล่วงหน้า รองรับภาษา (มนุษย์) 66 ภาษา
ประสิทธิภาพล้ำสมัย กล่าวอ้างว่ามีความแม่นยำเท่าหรือมากกว่า UDPipe
นอกจากนี้ยังรวมถึงอินเทอร์เฟซสำหรับ Stanford CoreNLP (Java) ด้วย
อ้างอิง: Peng Qi, Yuhao Zhang, Yuhui Zhang, Jason Bolton และ Christopher D. Manning. 2020. Stanza: ชุดเครื่องมือประมวลผลภาษาธรรมชาติด้วย Python สำหรับภาษาของมนุษย์หลายภาษา ใน การสาธิตระบบของสมาคมภาษาศาสตร์เชิงคำนวณ (ACL)
Stanford CoreNLP - https://stanfordnlp.github.io/CoreNLP/ ดู Stanza
เป็นที่นิยมใช้กันอย่างแพร่หลาย แต่ปัจจุบันถูกรวมเข้ากับ Stanza ไปแล้ว โดยเฉพาะอย่างยิ่งสำหรับผู้ใช้ Python
UDPipe (https://ufal.mff.cuni.cz/udpipe)
ไปป์ไลน์ที่ฝึกฝนได้ "ไม่ขึ้นกับภาษา" สำหรับการแยกคำ การติดแท็ก การหาคำหลัก และการวิเคราะห์ความสัมพันธ์ของคำ
ช้ากว่า spaCy แต่โดยทั่วไปแล้วมีความแม่นยำกว่า มีภาษาให้เลือกมากที่สุดเมื่อเทียบกับเครื่องมือ NLP ทั่วไปอื่นๆ (ยกเว้น Polyglot ซึ่งมีขอบเขตการใช้งานที่แคบกว่า)
เน้นที่รูปแบบความสัมพันธ์สากล (Universal Dependencies) – https://universaldependencies.org/ – และไฟล์/ข้อมูลในรูปแบบ ConLL-U
UDPipe 1 เขียนด้วยภาษา C++ พร้อมส่วนเชื่อมต่อ Python ส่วน UDPipe 2 เป็นต้นแบบที่เขียนด้วย Python (สามารถเข้าถึงโดยตรงผ่าน R ได้โดยใช้ไลบรารี udpipe ของ R) (สามารถรวม UDPipe เข้ากับ spaCy ได้โดยใช้แพ็กเกจ spacy-udpipe)
โมเดล 94 แบบสำหรับ 61 ภาษา แต่ละแบบประกอบด้วยตัวแยกคำ ตัวระบุแท็ก ตัวแยกคำหลัก และตัวแยกความสัมพันธ์ของคำ
เอกสารอ้างอิง:
(Straka et al. 2017) Milan Straka และ Jana Straková การแยกคำ การติดแท็กส่วนของคำพูด การหาคำหลัก และการวิเคราะห์ไวยากรณ์ UD 2.0 ด้วย UDPipe ในรายงานการประชุม CoNLL 2017 Shared Task: Multilingual Parsing from Raw Text to Universal Dependencies, แวนคูเวอร์ ประเทศแคนาดา สิงหาคม 2017
(Straka et al. 2016) Straka Milan, Hajič Jan, Straková Jana. UDPipe: ระบบประมวลผลที่ฝึกฝนได้สำหรับการประมวลผลไฟล์ CoNLL-U โดยดำเนินการแบ่งคำ, การวิเคราะห์ทางสัณฐานวิทยา, การติดแท็กส่วนของคำพูด และการแยกไวยากรณ์ ในรายงานการประชุมนานาชาติครั้งที่ 10 ว่าด้วยทรัพยากรและการประเมินภาษา (LREC 2016), Portorož, สโลวีเนีย, พฤษภาคม 2016
(ฉันและแคลร์ เคลลิง ใช้ UDPipe ในงานเขียนของเคลลิงและมอนโร ปี 2021)
Apache OpenNLP (https://opennlp.apache.org/)
“ชุดเครื่องมือที่ใช้การเรียนรู้ของเครื่องจักรสำหรับการประมวลผลข้อความภาษาธรรมชาติ”
“OpenNLP รองรับงาน NLP ทั่วไปส่วนใหญ่ เช่น การแยกคำ การแบ่งประโยค การระบุส่วนของคำพูด การแยกชื่อเอนทิตี การแบ่งกลุ่มคำ การวิเคราะห์ไวยากรณ์ การตรวจจับภาษา และการแก้ปัญหาการอ้างอิงร่วม”
เป็นส่วนสำคัญของระบบนิเวศโอเพนซอร์ส Apache (Java) มาอย่างยาวนาน แม้ว่าดูเหมือนว่าการใช้งานจะลดลงไปแล้วก็ตาม
อาจเป็นเพราะ openNLP มีมาตั้งแต่ปี 2011 และพัฒนาด้วยภาษา Java ทำให้มันค่อนข้างไม่เป็นที่รู้จักในวงการวิจัยด้านสังคมศาสตร์ที่ใช้ข้อความเป็นข้อมูล และเท่าที่ผมทราบ มันจึงไม่ค่อยถูกใช้งานอย่างแพร่หลาย
มีไลบรารี Python ให้ใช้งานที่นี่: https://github.com/curzona/opennlp-python (นอกจากนี้ยังมีไลบรารี R ซึ่งสาธิตอยู่ในบทช่วยสอนเครื่องมือ NLP ของ R)
Flair - https://github.com/flairNLP/flair
“Flair คือไลบรารี NLP ที่ทรงพลัง ช่วยให้คุณสามารถใช้โมเดลการประมวลผลภาษาธรรมชาติ (NLP) ที่ล้ำสมัยของเรากับข้อความของคุณได้ เช่น การระบุเอนทิตีชื่อเฉพาะ (NER), การระบุส่วนของคำพูด (PoS), การสนับสนุนพิเศษสำหรับข้อมูลทางการแพทย์, การแยกความหมาย และการจำแนกประเภท พร้อมรองรับภาษาต่างๆ ที่เพิ่มขึ้นอย่างรวดเร็ว”
“Flair คือไลบรารีสำหรับการฝังข้อความ มีอินเทอร์เฟซที่ใช้งานง่าย ช่วยให้คุณสามารถใช้งานและผสมผสานการฝังคำและเอกสารต่างๆ ได้ รวมถึงการฝัง Flair ที่เราเสนอ การฝัง BERT และการฝัง ELMo”
“เฟรมเวิร์ก NLP สำหรับ PyTorch เฟรมเวิร์กของเราสร้างขึ้นโดยตรงบน PyTorch ทำให้ง่ายต่อการฝึกฝนโมเดลของคุณเองและทดลองใช้วิธีการใหม่ๆ โดยใช้การฝังข้อมูลและคลาสของ Flair”
โมเดลส่วนใหญ่ได้รับการโฮสต์โดย HuggingFace
อ้างอิง: Alan Akbik, Duncan Blythe และ Roland Vollgraf. 2018. “Contextual String Embeddings for Sequence Labeling.” COLING 2018, การประชุมวิชาการนานาชาติว่าด้วยภาษาศาสตร์เชิงคำนวณ ครั้งที่ 27. หน้า: 1638–1649.
AllenNLP - https://github.com/allenai/allennlp https://guide.allennlp.org/
“AllenNLP เป็นไลบรารีโอเพนซอร์สสำหรับสร้างโมเดลการเรียนรู้เชิงลึกสำหรับการประมวลผลภาษาธรรมชาติ พัฒนาโดยสถาบัน Allen Institute for Artificial Intelligence สร้างขึ้นบนพื้นฐานของ PyTorch และออกแบบมาเพื่อสนับสนุนนักวิจัย วิศวกร นักศึกษา ฯลฯ ที่ต้องการสร้างโมเดล NLP เชิงลึกคุณภาพสูงได้อย่างง่ายดาย โดยมีนามธรรมระดับสูงและ API สำหรับส่วนประกอบและโมเดลทั่วไปใน NLP สมัยใหม่ นอกจากนี้ยังให้เฟรมเวิร์กที่ขยายได้ซึ่งทำให้ง่ายต่อการเรียกใช้และจัดการการทดลอง NLP”
จากการสำรวจในปี 2020 พบว่าไลบรารี NLP นี้เป็นที่ใช้งานมากเป็นอันดับสามในอุตสาหกรรม
ตัวอย่างสาธิตที่คุณสามารถทดลองใช้งานจริงได้: https://demo.allennlp.org/named-entity-recognition/named-entity-recognition
พวกเขามีรายชื่อโครงการทางวิชาการที่น่าประทับใจซึ่งใช้ AllenNLP อยู่ที่นี่: https://gallery.allennlp.org
ไม่ใช่แค่ไปป์ไลน์การติดป้ายกำกับข้อมูล แต่เป็นเฟรมเวิร์กสำหรับการสร้างโมเดล NLP บน PyTorch มีโมเดลสำหรับงานประมวลผลภาษาธรรมชาติที่ซับซ้อนและการสร้างภาษาธรรมชาติ มีเครื่องมือสำหรับการตีความโมเดลและการลดอคติ
ทรานส์ฟอร์เมอร์ส (และแหล่งข้อมูลที่เกี่ยวข้องจาก HuggingFace https://huggingface.co/)
Hugging Face เป็นสตาร์ทอัพด้าน NLP ที่ระบุว่า “เรากำลังเดินทางเพื่อพัฒนาและทำให้ NLP เข้าถึงได้ง่ายสำหรับทุกคน และในระหว่างทาง เราก็มีส่วนร่วมในการพัฒนาเทคโนโลยีให้ดียิ่งขึ้น”
Hugging Face อาจเป็นที่รู้จักกันดีที่สุดในฐานะแหล่งที่มาของแพ็กเกจ transformers ซึ่ง ณ เวลาที่เขียนบทความนี้ มีโมเดลที่ฝึกฝนล่วงหน้าแล้ว 30 โมเดลในกว่า 100 ภาษา และสถาปัตยกรรมโครงข่ายประสาทเทียมสำหรับการเรียนรู้ภาษาแบบ transformer หลัก 8 แบบ ได้แก่ BERT, GPT, GPT-2, Transformer-XL, XLNet, XLM, RoBERTa และ DistilBERT นี่คือสุดยอดเครื่องมือ NLP ที่คุณสามารถทำได้ด้วยโค้ดเพียงไม่กี่บรรทัด
นอกจากนี้ Hugging Face ยังมีแพ็กเกจ "ชุดข้อมูล" ที่ประกอบด้วยชุดข้อมูลข้อความ/NLP มากกว่า 1000 ชุด
โมเดลและชุดข้อมูลมีให้ใช้งานที่ “ศูนย์กลาง” ของ Hugging Face: https://huggingface.co/models, https://huggingface.co/datasets
(แซม เบสต์วาเตอร์และผมใช้ไลบรารี transformers ในการสร้างตัวจำแนกท่าทางโดยใช้ BERT ในงานวิจัยของเบสต์วาเตอร์และมอนโร ปี 2021)
SparkNLP - https://nlp.johnsnowlabs.com/
Spark NLP สร้างขึ้นบนพื้นฐานของ “Spark” ซึ่งเป็นระบบนิเวศสำหรับการจัดการและวิเคราะห์ข้อมูลแบบกระจายขนาดใหญ่
จากวิกิพีเดีย: “Spark NLP เป็นไลบรารีประมวลผลข้อความแบบโอเพนซอร์สสำหรับการประมวลผลภาษาธรรมชาติขั้นสูงสำหรับภาษาโปรแกรม Python, Java และ Scala ไลบรารีนี้สร้างขึ้นบน Apache Spark และไลบรารี Spark ML จุดประสงค์คือการจัดหา API สำหรับไปป์ไลน์การประมวลผลภาษาธรรมชาติที่นำผลการวิจัยทางวิชาการล่าสุดมาใช้เป็นซอฟต์แวร์ระดับใช้งานจริง ปรับขนาดได้ และฝึกฝนได้ ไลบรารีนี้มีโมเดลเครือข่ายประสาทเทียมที่ผ่านการฝึกฝนล่วงหน้า ไปป์ไลน์ และการฝังข้อมูล รวมถึงการสนับสนุนการฝึกฝนโมเดลแบบกำหนดเอง”
เครื่องมือสำหรับการระบุคำประกอบด้วย: “ตัวแยกคำ, ตัวปรับมาตรฐาน, การตัดคำรากศัพท์, การหาคำหลัก, นิพจน์ปกติ, ตัวจับคู่ข้อความ, ตัวแบ่งกลุ่มคำ, ตัวจับคู่วันที่, ตัวตรวจจับประโยค, ตัวตรวจจับประโยคเชิงลึก, ตัวระบุส่วนของคำพูด, ตัวตรวจจับความรู้สึกแบบ Vivekn, การวิเคราะห์ความรู้สึก, การระบุเอนทิตีที่มีชื่อ, เครื่องมือระบุคำแบบฟิลด์สุ่มแบบมีเงื่อนไข, เครื่องมือระบุคำแบบการเรียนรู้เชิงลึก, การตรวจสอบและแก้ไขการสะกดคำ, ตัวแยกวิเคราะห์ความสัมพันธ์ทางไวยากรณ์, ตัวแยกวิเคราะห์ความสัมพันธ์ทางไวยากรณ์แบบมีประเภท, การจำแนกเอกสาร และการตรวจจับภาษา”
“Models Hub” ของ SparkNLP ประกอบด้วย “ไปป์ไลน์ที่ผ่านการฝึกฝนล่วงหน้าพร้อมฟังก์ชันการแบ่งคำ การหาคำหลัก การระบุส่วนของคำพูด และการระบุชื่อเอนทิตี สำหรับมากกว่าสิบสามภาษา; การฝังคำ เช่น GloVe, ELMo, BERT, ALBERT, XLNet, Small BERT และ ELECTRA; การฝังประโยค เช่น Universal Sentence Embeddings (USE) และ Language Agnostic BERT Sentence Embeddings (LaBSE)”
นอกจากนี้ยังมี Spark OCR ด้วย จากวิกิพีเดีย: “Spark OCR เป็นส่วนขยายอีกอย่างหนึ่งของ Spark NLP สำหรับการรู้จำอักขระด้วยแสง (OCR) จากรูปภาพ เอกสาร PDF ที่สแกน และไฟล์ DICOM โดยมีคุณสมบัติการประมวลผลภาพเบื้องต้นหลายอย่างเพื่อปรับปรุงผลลัพธ์การรู้จำข้อความ เช่น การกำหนดค่าเกณฑ์แบบปรับได้และการลดสัญญาณรบกวน การตรวจจับและแก้ไขความเอียง การปรับขนาดแบบปรับได้ การวิเคราะห์เค้าโครงและการตรวจจับพื้นที่ การตัดภาพ การลบวัตถุพื้นหลัง เนื่องจาก Spark OCR และ Spark NLP มีการเชื่อมโยงกันอย่างแน่นหนา ผู้ใช้จึงสามารถรวมไปป์ไลน์ NLP และ OCR เข้าด้วยกันสำหรับงานต่างๆ เช่น การดึงข้อความจากรูปภาพ การดึงข้อมูลจากตาราง การรู้จำและเน้นเอนทิตีที่มีชื่อในเอกสาร PDF หรือการปิดบังข้อความที่ละเอียดอ่อนเพื่อลบข้อมูลส่วนบุคคลออกจากรูปภาพ”
มีสมุดบันทึก Quick Start (https://colab.research.google.com/github/JohnSnowLabs/spark-nlp-workshop/blob/master/jupyter/quick_start_google_colab.ipynb) จากนั้นก็ต้องขยับขึ้นไปอีกขั้นเพื่อไปยังสมุดบันทึก “Basics”: https://colab.research.google.com/github/JohnSnowLabs/spark-nlp-workshop/blob/master/tutorials/Certification_Trainings/Public/1.SparkNLP_Basics.ipynb
NLP Architect (https://github.com/IntelLabs/nlp-architect)
“NLP Architect เป็นไลบรารี Python แบบโอเพนซอร์สสำหรับสำรวจโครงสร้างและเทคนิคการเรียนรู้เชิงลึกที่ทันสมัยที่สุด เพื่อเพิ่มประสิทธิภาพโครงข่ายประสาทเทียมสำหรับการประมวลผลภาษาธรรมชาติและการทำความเข้าใจภาษาธรรมชาติ” “NLP Architect เป็นไลบรารีที่เน้นโมเดล ออกแบบมาเพื่อแสดงให้เห็นถึงการเพิ่มประสิทธิภาพโครงข่ายประสาทเทียมที่แปลกใหม่และแตกต่าง ไลบรารีนี้ประกอบด้วยโมเดลที่เกี่ยวข้องกับ NLP/NLU สำหรับแต่ละงาน โครงสร้างโครงข่ายประสาทเทียมที่แตกต่างกัน (ซึ่งใช้ในโมเดล) ขั้นตอนสำหรับการลดความซับซ้อนของเวิร์กโฟลว์ในไลบรารี ตัวประมวลผลข้อมูลและตัวโหลดชุดข้อมูลที่กำหนดไว้ล่วงหน้า และยูทิลิตี้อื่นๆ ไลบรารีนี้ได้รับการออกแบบให้เป็นเครื่องมือสำหรับการพัฒนาโมเดล: การประมวลผลข้อมูลเบื้องต้น การสร้างโมเดล การฝึกฝน การตรวจสอบความถูกต้อง การอนุมาน การบันทึก หรือการโหลดโมเดล”
โมเดล NLP สำหรับการแบ่งคำเป็นกลุ่ม การระบุเอนทิตีที่มีชื่อ การวิเคราะห์ความสัมพันธ์ทางไวยากรณ์ การสกัดเจตนา การจำแนกความรู้สึก และโมเดลภาษา
โมเดลการเข้าใจภาษาธรรมชาติสำหรับการวิเคราะห์ความรู้สึกตามแง่มุม การตรวจจับเจตนา การฝังวลีนาม การตรวจจับความหมายของคำ การระบุความสัมพันธ์ การอ้างอิงร่วมข้ามเอกสาร การแบ่งส่วนความหมายของวลีนาม
จาก Intel
torchtext (https://pytorch.org/text/stable/index.html)
torchtext เป็นไลบรารีสำหรับใช้กับเฟรมเวิร์กการเรียนรู้เชิงลึก PyTorch (มีไลบรารีที่คล้ายกันอย่าง torchvision และ torchaudio) โดยมีเครื่องมือประมวลผลข้อมูล (รวมถึงตัวแยกคำ, การฝังข้อมูลที่ได้รับการฝึกฝนล่วงหน้า, ตัวชี้วัด NLP) สำหรับข้อความและชุดข้อมูลยอดนิยมต่างๆ
Polyglot - https://polyglot.readthedocs.io/en/latest/
NLP สำหรับภาษาจำนวนมาก ("16-196 ภาษาสำหรับงานต่างๆ") ชุมชนขนาดเล็ก
การตรวจจับภาษา (196 ภาษา), การแยกคำ (196), การระบุเอนทิตีที่มีชื่อ (40), การติดแท็กส่วนของคำพูด (16), การวิเคราะห์ความรู้สึก (136), การฝังคำ (137), สัณฐานวิทยา (137), การถอดเสียง (69)
PyNLPl - https://pynlpl.readthedocs.io/
“PyNLPl (อ่านว่า 'ไพน์แอปเปิล') เป็นไลบรารี Python สำหรับการประมวลผลภาษาธรรมชาติ ประกอบด้วยโมดูลต่างๆ ที่มีประโยชน์สำหรับงาน NLP ทั้งที่พบได้ทั่วไปและไม่ค่อยพบเห็น PyNLPl สามารถใช้สำหรับงานพื้นฐาน เช่น การแยก n-gram และรายการความถี่ และการสร้างแบบจำลองภาษาอย่างง่าย นอกจากนี้ยังมีประเภทข้อมูลและอัลกอริทึมที่ซับซ้อนกว่านั้น ยิ่งไปกว่านั้น ยังมีตัวแยกวิเคราะห์สำหรับรูปแบบไฟล์ที่ใช้กันทั่วไปใน NLP (เช่น FoLiA/Giza/Moses/ARPA/Timbl/CQL) และยังมีไคลเอ็นต์สำหรับเชื่อมต่อกับเซิร์ฟเวอร์เฉพาะด้าน NLP ต่างๆ ที่โดดเด่นที่สุดของ PyNLPl คือไลบรารีที่ครอบคลุมมากสำหรับการทำงานกับ FoLiA XML (Format for Linguistic Annotatation)”
กล่าวกันว่ามีข้อดีสำหรับรูปแบบข้อมูลที่ "แปลกใหม่" เช่น FoLiA/Giza/Moses/ARPA/Timbl/CQL
