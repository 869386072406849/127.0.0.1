PyTorch - https://pytorch.org
แพลตฟอร์มการเรียนรู้เชิงลึก “PyTorch ช่วยให้การทดลองทำได้อย่างรวดเร็ว ยืดหยุ่น และมีประสิทธิภาพในการผลิต ผ่านส่วนหน้าแบบไฮบริด การฝึกอบรมแบบกระจาย และระบบนิเวศของเครื่องมือและไลบรารี” เป็นแบบฉบับของ Python อย่างแท้จริง รองรับเฉพาะ Linux / OSx เท่านั้น
การคำนวณเทนเซอร์ (แบบ NumPy) บน GPU
มีระบบนิเวศของไลบรารี "PyTorch" ซึ่งรวมถึงการเรียนรู้เชิงลึกที่รวดเร็ว (fastai, Horovod, Ignite, PySyft, TensorLy), การประมวลผลภาษาธรรมชาติ (Flair, AllenNLP) และการแปลภาษาด้วยเครื่อง (Translate) รวมถึงโมเดลบทสนทนา (ParlAI)
ได้รวม Caffe และ Caffe2 ซึ่งเป็นไลบรารีการเรียนรู้เชิงลึกที่เน้นการประมวลผลภาพเข้าไว้ด้วยกันแล้ว
เรามีโปรเจ็กต์หลายโครงการใน C-SoDA ที่ใช้ PyTorch
ดู https://github.com/huggingface/pytorch-transformers สำหรับการใช้งานโมเดลภาษา Transformer ที่ผ่านการฝึกฝนล่วงหน้าใน PyTorch ซึ่งปัจจุบันได้แก่ BERT, (OpenAI), GPT, (OpenAI), GPT-2 และ Transformer-XL
ดู http://nlp.seas.harvard.edu/2018/04/03/attention.html สำหรับการใช้งาน Transformer ดั้งเดิมจากบทความ “Attention is All You Need” ด้วย PyTorch (พร้อมคำอธิบายประกอบ)
