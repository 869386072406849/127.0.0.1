การเป็นผู้ดูแลหมายความว่าอย่างไร?
หากคุณรักษาโปรเจ็กต์โอเพ่นซอร์สที่ผู้คนจํานวนมากใช้ คุณอาจสังเกตเห็นว่าคุณกําลังเขียนโค้ดน้อยลงและตอบสนองต่อปัญหามากขึ้น

ในช่วงแรกของโครงการ คุณกําลังทดลองแนวคิดใหม่ๆ และตัดสินใจตามสิ่งที่คุณต้องการ เมื่อโครงการของคุณได้รับความนิยมเพิ่มขึ้น คุณจะพบว่าตัวเองทํางานร่วมกับผู้ใช้และผู้มีส่วนร่วมมากขึ้น

การดูแลโครงการต้องใช้มากกว่ารหัส งานเหล่านี้มักเป็นสิ่งที่ไม่คาดคิด แต่ก็มีความสําคัญต่อโครงการที่กําลังเติบโตไม่แพ้กัน เราได้รวบรวมวิธีต่างๆ เพื่อทําให้ชีวิตของคุณง่ายขึ้น ตั้งแต่กระบวนการจัดทําเอกสารไปจนถึงการใช้ประโยชน์จากชุมชนของคุณ

การจัดทําเอกสารกระบวนการของคุณ
การเขียนสิ่งต่าง ๆ ลงเป็นหนึ่งในสิ่งที่สําคัญที่สุดที่คุณสามารถทําได้ในฐานะผู้ดูแล

เอกสารไม่เพียงแต่ให้ความกระจ่างแก่ความคิดของคุณเองเท่านั้น แต่ยังช่วยให้ผู้อื่นเข้าใจสิ่งที่คุณต้องการหรือคาดหวังก่อนที่พวกเขาจะถามด้วยซ้ํา

การเขียนสิ่งต่าง ๆ ลงไปทําให้ง่ายต่อการปฏิเสธเมื่อมีบางอย่างไม่เข้ากับขอบเขตของคุณ นอกจากนี้ยังช่วยให้ผู้คนเสนอและช่วยเหลือได้ง่ายขึ้นอีกด้วย คุณไม่มีทางรู้ว่าใครอาจกําลังอ่านหรือใช้โปรเจ็กต์ของคุณ

แม้ว่าคุณจะไม่ใช้ย่อหน้าเต็ม แต่การจดสัญลักษณ์แสดงหัวข้อย่อยก็ยังดีกว่าไม่เขียนเลย

อย่าลืมอัปเดตเอกสารของคุณให้ทันสมัยอยู่เสมอ หากคุณไม่สามารถทําได้เสมอไป ให้ลบเอกสารที่ล้าสมัยของคุณหรือระบุว่าล้าสมัย เพื่อให้ผู้ร่วมให้ข้อมูลทราบว่ายินดีต้อนรับการอัปเดต

เขียนวิสัยทัศน์ของโครงการของคุณ
เริ่มต้นด้วยการเขียนเป้าหมายของโครงการของคุณ เพิ่มลงใน README ของคุณ หรือสร้างไฟล์แยกต่างหากที่เรียกว่า VISION หากมีสิ่งประดิษฐ์อื่นๆ ที่สามารถช่วยได้ เช่น แผนงานโครงการ ก็สามารถเปิดเผยสิ่งเหล่านั้นต่อสาธารณะได้เช่นกัน

การมีวิสัยทัศน์ที่ชัดเจนและเป็นเอกสารช่วยให้คุณมีสมาธิและช่วยให้คุณหลีกเลี่ยง “ขอบเขต creep” จากการมีส่วนร่วมอื่นๆ’

ตัวอย่างเช่น @lord ค้นพบว่าการมีวิสัยทัศน์ของโครงการช่วยให้เขาทราบว่าคําขอใดที่จะใช้เวลาไปกับ ในฐานะผู้ดูแลคนใหม่ เขารู้สึกเสียใจที่ไม่ยึดติดกับขอบเขตของโปรเจ็กต์ของเขาเมื่อเขาได้รับคําขอฟีเจอร์แรก กระดานชนวน●

