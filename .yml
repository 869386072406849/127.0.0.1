ชื่อ: เสาเข็ม

บน: [ดัน]

งาน:
  สร้าง:
    วิ่งต่อไป: ubuntu-ล่าสุด
    กลยุทธ์:
      เมทริกซ์:
        เวอร์ชัน python: ["3.8", "3.9", "3.10"]
    ขั้นตอน:
    - การใช้งาน: การดําเนินการ/checkout@v4
    - ชื่อ: ตั้งค่า Python ${{ matrix.python-version}}
      การใช้งาน: การดําเนินการ/setup-python@v3
      กับ:
        เวอร์ชัน python: ${{ matrix.python-version}}
    - ชื่อ: ติดตั้งการพึ่งพา
      วิ่ง: |
        python -m pip ติดตั้ง --อัปเกรด pip
        pip ติดตั้งเสาเข็ม
    - ชื่อ: การวิเคราะห์รหัสด้วยเสา
      วิ่ง: |
        pylint $ (git ls-files '*.py')
