<link rel="canonical" href="https://www.dga.or.th/" />
<meta property="og:locale" content="th_TH" />
<meta property="og:type" content="website" />
<meta property="og:title" content="หน้าแรก - สำนักงานพัฒนารัฐบาลดิจิทัล (องค์การมหาชน) สพร. หรือ DGA" />
<meta property="og:description" content="Digital Government in Action Policy &amp; Regulation Standard มติคณะรัฐมนตรีด้านรัฐบาลดิจิทัล DGA News บทความ DGA News สถาบัน TDGA โดย DGA เข้าร่วมเป็นวิทยากรบรรยาย ในการประชุมสัมมนาเชิงปฏิบัติการหัวข้อ การจัดทำกลยุทธ์ด้านการสื่อสารและสารสนเทศของ ศูนย์อำนวยการรักษาผลประโยชน์ของชาติทางทะเล (ศรชล.) 12 Feb 67 | 22 สถาบันพัฒนาบุคลากรภาครัฐด้านดิจิทัล (TDGA) โดย DGA เข้าร่วมเป็นวิทยากรบรรยาย ในการประชุมสัมมนาเชิงปฏิบัติการหัวข้อ การจัดทำกลยุทธ์ด้านการสื่อสารและสารสนเทศของ ศูนย์อำนวยการรักษาผลประโยชน์ของชาติทาง… อ่านต่อ สถาบัน TDGA โดย DGA จัดอบรมหลักสูตร GDPO รุ่นที่ 7 สร้างเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคล (DPO) เพื่อพัฒนาความรู้และทักษะของบุคลากรภาครัฐที่ปฏิบัติงานเกี่ยวกับการคุ้มครองข้อมูลส่วนบุคคลตามมาตรฐานสากล 9 Feb 67 | 34 สถาบัน TDGA โดย DGA จัดอบรมหลักสูตร GDPO รุ่นที่ 7 สร้างเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคล (DPO) เพื่อพัฒนาความรู้และทักษะของบุคลากรภาครัฐที่ปฏิบัติงานเกี่ยวกับการคุ้มครองข้อมูลส่วนบุคคลตามมาตรฐานส… อ่านต่อ TDGA ภายใต้การดำเนินงานของสำนักงานพัฒนารัฐบาลดิจิทัล (องค์การมหาชน) หรือ DGA ร่วมหารือกับมูลนิธิ ICDL Foundation แห่งสหภาพยุโรปในการยกระดับทักษะด้านดิจิทัลของบุคลากรภาครัฐสู่มาตรฐานสากล เพิ่มศักยภาพกำลังคนดิจิทัลและเพิ่มขีดความสามารถให้กับประเทศไทย 2 Feb 67 | 60 นาย ชรินทร์ ธีรฐิตยางกูร ผู้อำนวยการสถาบัน TDGA พร้อมด้วย ดร.ศุภวรรณ ธาราโภคากุล ที่ปรึกษาดิจิทัลอาวุโส ให้การต้อนรับ Mr.Damien O’Sullivan Chief Executive Officer ICDL Foundation แห่งสหภาพยุโรป คณะ… อ่านต่อ ดร.ปานปรีย์ รองนายกฯ นั่งหัวโต๊ะเคาะงบบูรณาการรัฐบาลดิจิทัล 2568 รวม 7,964 ล้านบาท ร่วมกับ ดร.พวงเพ็ชร รมต.สำนักนายก ตั้งเป้าเปลี่ยน “รัฐอุปสรรค” ให้เปลี่ยนเป็น “รัฐสนับสนุน” ด้วยบริการดิจิทัลจากภาครัฐเพื่ออำนวยความสะดวกประชาชน 1 Feb 67 | 421..." />
