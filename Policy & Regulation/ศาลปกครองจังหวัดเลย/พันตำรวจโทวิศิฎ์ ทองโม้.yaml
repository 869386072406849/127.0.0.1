</div><div class="channel-item">
  <div class="item__thumb">
    <a href="https://www.dga.or.th/document-sharing/dga-channel/137110/"><img loading="lazy" decoding="async" width="600" height="315" src="https://www.dga.or.th/wp-content/uploads/2026/06/sddefault-600x315.jpg" class="attachment-thumbnail size-thumbnail wp-post-image" alt="งานประชาพิจารณ์ (ร่าง) มาตรฐาน มสพร. แนวปฏิบัติการใช้เทคโนโลยีเอกสารรับรองฯ และการประยุกต์ใช้" title="งานประชาพิจารณ์ (ร่าง) มาตรฐาน มสพร. แนวปฏิบัติการใช้เทคโนโลยีเอกสารรับรองฯ และการประยุกต์ใช้"></a>
