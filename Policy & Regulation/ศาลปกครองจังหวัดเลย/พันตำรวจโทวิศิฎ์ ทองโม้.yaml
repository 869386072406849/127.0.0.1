  <div class="item__info">
    <h3 class="item__title"><a href="https://www.dga.or.th/document-sharing/dga-channel/137110/">งานประชาพิจารณ์ (ร่าง) มาตรฐาน มสพร. แนวปฏิบัติการใช้เทคโนโลยีเอกสารรับรองฯ และการประยุกต์ใช้</a></h3>
    <div class="item__meta">
      <span class="meta__date"><i class="fas fa-calendar"></i> 25 Jun 69</span> | <span class="meta__view"><i class="fas fa-eye"></i> 178</span>
    </div>
    <div class="item__excerpt">DGA ขอเชิญรับชมงานประชาพิจารณ์ (ร่าง) มาตรฐานสำนักงานพัฒนารัฐบาลดิจิทัล (องค์การมหาชน) (มสพร.) สำหรับแนวปฏิบัติการใช้เทคโนโลยีเอกสารรับรองและเอกสารสำแดงดิจิทัล และการประยุกต์ใช้สำหรับใบอนุญาตภาครัฐ โดยมี ดร.อาศิส อัญญะโพธิ์ รองผู้อำนวยการสำนักงานพัฒนารัฐบาลดิจิทัล เป็นประธานกล่าวเปิดงาน ต่อเนื่องด้วยการเสวนา เรื่อง “ร่วมสร้างใบอนุญาตภาครัฐที่เชื่อถือได้ โดยการเชื่อมโยงแลกเปลี่ยนข้อมูลอย่างมั่นใจ” โดย รศ. ดร.เกริก ภิรมย์โสภา ประธานคณะทำงานเทคนิคด้านมาตรฐานกระบวนการและการดำเนินงานทางดิจิทัล ผศ. ดร.มารอง ผดุงสิทธิ์ ประธานคณะทำงานเทคนิคด้านมาตรฐานการเชื่อมโยงและแลกเปลี่ยนข้อมูลภาครัฐ และผู้แทนจากหน่วยงานสำนักงานพัฒนาธุรกรรมทางอิเล็กทรอนิกส์ กรมการขนส่งทางบก โดยมี ดร.อุรัชฎา เกตุพรหม ผู้อำนวยการฝ่ายมาตรฐานดิจิทัลภาครัฐ เป็นผู้ดำเนินรายการ เมื่อวันที่ 25 มิถุนายน 2569 ผ่านการประชุมออนไลน์ https://youtu.be/YbQmNxJ8jtg ทั้งนี้ (ร่าง) มาตรฐานสำนักงานพัฒนารัฐบาลดิจิทัล (องค์การมหาชน) ว่าด้วยแนวปฏิบัติกระบวนการทางดิจิทัลภาครัฐ – ส่วนที่ 8 เรื่อง เอกสารใบอนุญาตอิเล็กทรอนิกส์ภาครัฐในรูปแบบเอกสารรับรองดิจิทัลและเอกสารสำแดงดิจิทัล เวอร์ชัน 1.0 และ (ร่าง) มาตรฐานสำนักงานพัฒนารัฐบาลดิจิทัล (องค์การมหาชน) ว่าด้วยมาตรฐานการเชื่อมโยงและแลกเปลี่ยนข้อมูลภาครัฐ แนวปฏิบัติและหลักการพื้นฐานในการออกแบบมาตรฐานการเชื่อมโยงและแลกเปลี่ยนข้อมูลภาครัฐ ด้านความหมายข้อมูล กรณีเอกสารรับรองและเอกสารสำแดงอิเล็กทรอนิกส์ภาครัฐ เวอร์ชัน 1.0 นี้ เป็นแนวปฏิบัติการใช้เทคโนโลยีเอกสารรับรองดิจิทัลและเอกสารสำแดงดิจิทัล รวมถึงการประยุกต์ใช้สำหรับใบอนุญาตภาครัฐ เพื่อให้มาตรฐานมีความเหมาะสม ปฏิบัติได้จริง และสอดคล้องกับบริบทการให้บริการภาครัฐของประเทศไทย ดาวน์โหลดเอกสารเพิ่มเติมได้ที่ https://standard.dga.or.th/kk5lu0/</div>
  </div>
